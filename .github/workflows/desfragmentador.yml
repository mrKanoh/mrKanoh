# Regenera assets/ventana-desfragmentador.svg una vez al día y hace commit solo si cambió.
name: Desfragmentador

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desfragmentador
  cancel-in-progress: false

jobs:
  regenerar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Generar el SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/desfragmentador.py

      - name: Commit si cambió
        run: |
          if git diff --quiet -- assets/ventana-desfragmentador.svg; then
            echo "Sin cambios en el SVG."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ventana-desfragmentador.svg
          git commit -m "desfragmentador: actualiza la actividad del último año"
          # Integra main si avanzó desde el checkout; si otro commit tocó el SVG, falla sin forzar.
          git pull --rebase origin main
          git push origin HEAD:main
